# changelog-types.conf — Conventional Commit type -> changelog section
# 一行一项：type=emoji[=章节文案]（也接受 type=emoji=章节文案）；行的先后 = 章节先后。
# 整行以 # 开头 = 注释；形如 `# type=…` 的注释行表示"该 type 不进更新日志"，
# 其余注释行是说明文字。未在此登记的合法 type 落 `### 🔖 Other`（照常进日志）。
# 本文件只是显示层：next-version.sh / sdk_release.py 的档位推导绝不读它。
breaking=💥=Breaking Changes
feat=✨=Features
fix=🐛=Bug Fixes
perf=⚡=Performance
revert=⏪=Reverts
refactor=♻️=Refactoring
# docs=📝=Documentation
# test=✅=Tests
# style=💄=Style
# chore=🔧=Chores
# ci=👷=CI
# build=📦=Build
