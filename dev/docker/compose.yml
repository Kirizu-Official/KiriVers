# KiriVers 本地开发依赖：PostgreSQL 与 Redis。
# 数据目录：dev/docker/data/（已忽略入库）
# 配置目录：dev/docker/postgres/、dev/docker/redis/
# 使用方式（在仓库根目录）：docker compose -f dev/docker/compose.yml up -d
#
# 首次从命名卷切换到本地目录时，先 down 再 up；旧命名卷中的数据不会自动迁移。

name: kirivers

services:
  postgres:
    image: postgres:17-alpine
    container_name: kirivers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kirivers
      POSTGRES_USER: kirivers
      POSTGRES_PASSWORD: 8WdeOilkFYo6OcBE3bdmg2
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirivers -d kirivers"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kirivers

  redis:
    image: redis:7-alpine
    container_name: kirivers-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 供 redis-cli 健康检查使用，须与 redis.conf 中 requirepass 一致。
      REDISCLI_AUTH: aa4BTLHj85zZsebO3ugcja1Mn20HIB5r
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - kirivers

networks:
  kirivers:
    name: kirivers
    driver: bridge
