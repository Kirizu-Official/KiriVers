workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

variables:
  SDK_LANG: "python"
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

stages:
  - test
  - release

.test_rules: &test_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "sdk/python"

test:
  stage: test
  image: python:3.12
  <<: *test_rules
  before_script:
    - python3 --version
  script:
    - python3 scripts/sdk_release.py self-check
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        python3 scripts/sdk_release.py commitlint --pr-title "$CI_MERGE_REQUEST_TITLE" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA"
      fi
    - pip install -e ".[dev]" && pytest

release:
  stage: release
  image: python:3.12
  needs: [test]
  resource_group: release-python
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "sdk/python"
  before_script:
    - python3 --version
  script:
    - |
      set -euo pipefail
      python3 scripts/sdk_release.py plan | tee plan.json
      ACTION=$(python3 -c "import json; print(json.load(open('plan.json'))['action'])")
      if [ "$ACTION" = skip ]; then
        python3 -c "import json; print(json.load(open('plan.json')).get('reason',''))"
        exit 0
      fi
      pip install -e ".[dev]" && pytest
      if [ -z "${PYPI_TOKEN:-}" ]; then echo "missing CI variable PYPI_TOKEN"; exit 1; fi
      python3 scripts/sdk_release.py apply | tee apply.json
      git config user.email "ci@noreply.localhost"
      git config user.name "gitlab-ci"
      ACTION=$(python3 -c "import json; print(json.load(open('apply.json'))['action'])")
      VERSION=$(python3 -c "import json; print(json.load(open('apply.json'))['version'])")
      TAG=$(python3 -c "import json; print(json.load(open('apply.json'))['tag'])")
      if [ "$ACTION" = bump ]; then
        git add -u
        git restore --staged sdk-release-notes.md 2>/dev/null || true
        git diff --cached --quiet || git commit -m "chore(release): $VERSION"
      fi
      git tag -a "$TAG" -m "$TAG"
      TOKEN="${GIT_PUSH_TOKEN:-$CI_JOB_TOKEN}"
      git remote set-url origin "https://gitlab-ci-token:${TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:$CI_COMMIT_BRANCH" --follow-tags
      curl -fsS --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=$TAG" --data-urlencode "tag_name=$TAG" --data-urlencode "ref=$CI_COMMIT_BRANCH" \
        --data-urlencode "description=$(cat sdk-release-notes.md)" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      pip install build twine
      python -m build
      TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN" twine upload dist/*

