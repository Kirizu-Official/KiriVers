name: "功能建议 / Feature request"
description: "提出一个新能力或改进 / Propose a capability or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这个能力不属于 `website/docs/contribute/whitepaper.md` 里已经排除的方向。实现它的 PR 必须回到这里关联（`Fixes #本Issue编号` 或侧栏 Development → Link an issue）。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 谁在什么场景下受阻，而不是"加个按钮"
      placeholder: 作为……我需要……，但现在……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的做法 / Proposed solution
      description: 接口、配置项、管理台入口的具体形态；有备选方案也写在这里
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 现在只能怎么绕过去
  - type: dropdown
    id: area
    attributes:
      label: 影响范围 / Area
      multiple: true
      options:
        - 管理端 API / 控制台
        - 客户端 API
        - 客户端 SDK
        - 差量引擎
        - 存储适配器
        - 部署 / 镜像 / 构建脚本
        - 文档
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 你是否准备实现 / Willing to implement
      options:
        - label: 我准备开 PR 实现它（届时 PR 标题用 Conventional Commits，并关联本 Issue）
        - label: 我只能提供需求描述，实现交给维护者
