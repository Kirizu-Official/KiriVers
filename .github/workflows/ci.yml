name: ci
on:
  pull_request:
    branches: [sdk/csharp]
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDK_LANG: csharp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Conventional Commits
        run: |
          python3 scripts/sdk_release.py commitlint \
            --pr-title "${{ github.event.pull_request.title }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python3 scripts/sdk_release.py self-check
      - run: dotnet test
