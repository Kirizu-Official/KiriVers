name: release
# A merged pull request is the only publish entry point: a direct push
# (including the bot's own bump commit) and a closed-but-unmerged pull
# request must both stay silent.
on:
  pull_request:
    types: [closed]
    branches: [sdk/java]
concurrency:
  group: release-java
  cancel-in-progress: false
permissions:
  contents: write
  # Read the merge commit's pull request number for the changelog.
  pull-requests: read
  id-token: write
jobs:
  release:
    # Only a merged pull request publishes.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      SDK_LANG: java
      # Fast path for the changelog's `#<PR>` tail: this run is the merge
      # of exactly that pull request.
      KIRIVERS_PR_NUMBER: ${{ github.event.pull_request.number }}
      SDK_PUBLISH: ${{ vars.SDK_PUBLISH }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/sdk/java
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python3 scripts/sdk_release.py self-check
      - run: chmod +x mvnw && ./mvnw -B test
      - name: Plan release
        id: rel
        run: |
          python3 scripts/sdk_release.py plan | tee plan.json
          echo "action=$(jq -r .action plan.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag plan.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version plan.json)" >> "$GITHUB_OUTPUT"
      - name: Skip
        if: steps.rel.outputs.action == 'skip'
        run: jq -r .reason plan.json
      - name: Require registry secrets
        if: steps.rel.outputs.action != 'skip'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "missing secret MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD"
            exit 1
          fi
      - name: Apply version, tag, push, GitHub Release
        if: steps.rel.outputs.action != 'skip'
        run: |
          set -euo pipefail
          python3 scripts/sdk_release.py apply | tee apply.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ACTION=$(jq -r .action apply.json)
          VERSION=$(jq -r .version apply.json)
          TAG=$(jq -r .tag apply.json)
          BRANCH=sdk/java
          if [ "$ACTION" = bump ]; then
            # apply writes the manifest, CHANGELOG.md and the notes file.
            git add -A
            git restore --staged sdk-release-notes.md 2>/dev/null || true
            git status
            git diff --cached --quiet || git commit -m "chore(release): $VERSION"
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:$BRANCH" --follow-tags
          gh release create "$TAG" --title "$TAG" --notes-file sdk-release-notes.md --target "$BRANCH"

      - name: Publish Maven Central
        if: steps.rel.outputs.action != 'skip'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -e
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "missing secret MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD"
            exit 1
          fi
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML
          ./mvnw -B -DskipTests -Pci-central deploy
