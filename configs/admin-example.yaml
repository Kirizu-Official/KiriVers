# 管理平面（管理台 + CI Agent，默认 :8081）。
# 环境变量前缀 KIRIVERS_ADMIN_（例：addr → KIRIVERS_ADMIN_ADDR）。
# 生产环境建议绑定 127.0.0.1 或内网，并配合防火墙。
# gin.SetMode 是进程全局：任一平面 mode=debug 则整个进程为 debug，否则 release。

addr: ":8081"
mode: debug
# 关闭管理平面：不监听本地址，无管理 API / SPA / 反代。客户端平面与心跳仍运行。
# 改完须重启。环境变量：KIRIVERS_ADMIN_ENABLED
enabled: true
# 证书与私钥同时非空才启用 HTTPS；否则明文。无进程级 TLS 回退。
tls_cert: ""
tls_key: ""
# 信任的反向代理（IP 或 CIDR）。空 = 不信任 X-Forwarded-For，ClientIP 为直连地址。
# 环境变量：KIRIVERS_ADMIN_TRUSTED_PROXIES（逗号分隔）
trusted_proxies: []
# 编译后管理台静态根（yarn build → frontend/dist）。相对路径相对进程 CWD。
# 磁盘缺少 index.html 时使用编译进二进制的 frontend/dist；二者都没有则为 API-only。
# 空字符串显式关闭 UI 托管（即使二进制已内嵌管理台）。磁盘 index.html 优先于内嵌副本。
# 生产建议写绝对路径。环境变量：KIRIVERS_ADMIN_STATIC_DIR
static_dir: frontend/dist

log:
  system:
    level: debug
    console:
      enabled: true
      no_color: false
    file:
      enabled: true
      dir: ./logs
      filename: admin-system.log
      max_size_mb: 100
      max_backups: 10
      max_age_days: 28
      compress: true
      local_time: true
  access:
    level: debug
    console:
      enabled: true
      no_color: false
    file:
      enabled: true
      dir: ./logs
      filename: admin-access.log
      max_size_mb: 100
      max_backups: 10
      max_age_days: 28
      compress: true
      local_time: true
