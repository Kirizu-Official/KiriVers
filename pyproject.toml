[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kirivers-client"
version = "0.1.0"
description = "Official KiriVers native client SDK (JSON client plane)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kirizu-Official" }]
keywords = ["kirivers", "update", "client", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Kirizu-Official/KiriVers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kirivers_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
