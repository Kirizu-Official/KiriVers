[package]
name = "kirivers-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Official KiriVers native JSON client SDK (check, download, verify, optional apply)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kirizu-Official/KiriVers"
homepage = "https://github.com/Kirizu-Official/KiriVers"
documentation = "https://docs.rs/kirivers-client"
readme = "README.md"
keywords = ["kirivers", "update", "client"]
categories = ["api-bindings"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "openapi.client.json",
    "OPENAPI_REVISION",
]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "alloc", "pkcs8", "pem"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
unicode-normalization = "0.1"

[lib]
name = "kirivers_client"
path = "src/lib.rs"
